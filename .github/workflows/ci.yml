name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (dotnet build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build backend/backend.csproj --configuration Release

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Old screens still have lint problems: only the files changed in the PR are linted
      # until the final cleanup (issue #108) makes the whole project clean.
      - name: Lint changed files
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- 'src/*.ts' 'src/*.tsx' | sed 's#^frontend/##')
          if [ -z "$files" ]; then echo "Nenhum arquivo .ts/.tsx alterado."; exit 0; fi
          echo "$files"
          npx eslint $files
      - run: npm run build

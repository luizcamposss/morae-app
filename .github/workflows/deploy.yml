name: Deploy

# Every merge into main goes to production (https://morae.synergylab.tech).
# Setup and first deploy: deploy/README.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    name: Build and push images
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: morae-api
            context: backend
          - name: morae-web
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to the VPS
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Copy compose and deploy script
        run: |
          scp -i ~/.ssh/deploy_key docker-compose.prod.yaml deploy/deploy.sh \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ vars.DEPLOY_DIR }}/"
      - name: Run deploy
        # The registry token goes through stdin, so it never shows up in the VPS process list.
        run: |
          printf '%s\n' "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd '${{ vars.DEPLOY_DIR }}' && chmod +x deploy.sh && read -r GHCR_TOKEN && export GHCR_TOKEN && \
             IMAGE_TAG='${{ github.sha }}' GHCR_USER='${{ github.actor }}' ./deploy.sh"
      - name: Check the public site
        run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "${{ vars.PUBLIC_URL }}/api/health"

name: morae

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: moraeDB
      MYSQL_USER: morae
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent" ]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/luizcamposss/morae-api:${IMAGE_TAG:-latest}
    build: ./backend
    restart: unless-stopped
    env_file: .env.production
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DataProtection__KeysPath: /data/keys
      Storage__LocalPath: /data/storage
    volumes:
      - api_keys:/data/keys
      - api_storage:/data/storage
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - internal
    ports:
      - "127.0.0.1:8080:8080"

  web:
    image: ghcr.io/luizcamposss/morae-web:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"

networks:
  internal: {}

volumes:
  mysql_data: {}
  api_keys: {}
  api_storage: {}

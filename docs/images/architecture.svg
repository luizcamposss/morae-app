<svg width="1200" height="640" viewBox="0 0 1200 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura do MORAÊ</title>
  <desc id="desc">Arquitetura em camadas do MORAÊ, conectando frontend, API, serviços, domínio e banco de dados.</desc>
  <rect width="1200" height="640" rx="36" fill="#F9FAFB"/>
  <text x="60" y="76" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900">Arquitetura em camadas</text>
  <text x="60" y="116" fill="#4B5563" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Controllers finos, regras nos serviços, DTOs nas bordas e autorização centralizada.</text>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#111827" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0D7A3A"/>
    </marker>
  </defs>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="60" y="170" width="210" height="260" rx="28" fill="#FFFFFF"/>
    <text x="92" y="222" fill="#0B3D2E" font-size="24" font-weight="900">Frontend</text>
    <text x="92" y="260" fill="#4B5563" font-size="16" font-weight="700">React 19</text>
    <text x="92" y="288" fill="#4B5563" font-size="16" font-weight="700">TypeScript</text>
    <text x="92" y="316" fill="#4B5563" font-size="16" font-weight="700">Tailwind CSS</text>
    <text x="92" y="344" fill="#4B5563" font-size="16" font-weight="700">React Router</text>
    <text x="92" y="386" fill="#16A34A" font-size="15" font-weight="900">UX por perfil</text>
  </g>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="330" y="170" width="210" height="260" rx="28" fill="#FFFFFF"/>
    <text x="362" y="222" fill="#0B3D2E" font-size="24" font-weight="900">API</text>
    <text x="362" y="260" fill="#4B5563" font-size="16" font-weight="700">ASP.NET Core 8</text>
    <text x="362" y="288" fill="#4B5563" font-size="16" font-weight="700">Controllers</text>
    <text x="362" y="316" fill="#4B5563" font-size="16" font-weight="700">DTOs</text>
    <text x="362" y="344" fill="#4B5563" font-size="16" font-weight="700">JWT Auth</text>
    <text x="362" y="386" fill="#16A34A" font-size="15" font-weight="900">Sem regra no controller</text>
  </g>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="600" y="170" width="240" height="260" rx="28" fill="#FFFFFF"/>
    <text x="632" y="222" fill="#0B3D2E" font-size="24" font-weight="900">Aplicação</text>
    <text x="632" y="260" fill="#4B5563" font-size="16" font-weight="700">Services</text>
    <text x="632" y="288" fill="#4B5563" font-size="16" font-weight="700">PermissionService</text>
    <text x="632" y="316" fill="#4B5563" font-size="16" font-weight="700">AutoMapper</text>
    <text x="632" y="344" fill="#4B5563" font-size="16" font-weight="700">Exceptions</text>
    <text x="632" y="386" fill="#16A34A" font-size="15" font-weight="900">Regras de negócio</text>
  </g>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="900" y="170" width="240" height="260" rx="28" fill="#FFFFFF"/>
    <text x="932" y="222" fill="#0B3D2E" font-size="24" font-weight="900">Persistência</text>
    <text x="932" y="260" fill="#4B5563" font-size="16" font-weight="700">EF Core</text>
    <text x="932" y="288" fill="#4B5563" font-size="16" font-weight="700">MySQL</text>
    <text x="932" y="316" fill="#4B5563" font-size="16" font-weight="700">Identity</text>
    <text x="932" y="344" fill="#4B5563" font-size="16" font-weight="700">Migrations</text>
    <text x="932" y="386" fill="#16A34A" font-size="15" font-weight="900">Fonte da verdade</text>
  </g>

  <path d="M278 300H320" stroke="#0D7A3A" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M548 300H590" stroke="#0D7A3A" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M848 300H890" stroke="#0D7A3A" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="60" y="500" width="1080" height="72" rx="22" fill="#0B3D2E"/>
  <text x="92" y="545" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="900">Isolamento multi-condomínio:</text>
  <text x="362" y="545" fill="#DCFCE7" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">UserCondominium + UserCondominiumPermission protegem cada operação.</text>
</svg>

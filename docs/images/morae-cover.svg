<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MORAÊ - Plataforma de gestão de condomínios</title>
  <desc id="desc">Banner institucional do projeto MORAÊ com resumo do produto, stack e fluxo principal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B3D2E"/>
      <stop offset="0.52" stop-color="#0D7A3A"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#DCFCE7" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#052E20" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="44" fill="url(#bg)"/>
  <circle cx="1070" cy="80" r="150" fill="#86EFAC" opacity="0.22"/>
  <circle cx="1020" cy="560" r="210" fill="#DCFCE7" opacity="0.16"/>
  <circle cx="110" cy="105" r="115" fill="#86EFAC" opacity="0.28"/>

  <g transform="translate(70 70)">
    <rect width="76" height="76" rx="24" fill="#DCFCE7"/>
    <path d="M22 40.5L38 25L54 40.5V56C54 58.2 52.2 60 50 60H26C23.8 60 22 58.2 22 56V40.5Z" stroke="#16A34A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M32 60V47H44V60" stroke="#16A34A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="51" cy="49" r="4" fill="#16A34A"/>
  </g>

  <text x="170" y="110" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="4">MORAÊ</text>
  <text x="70" y="210" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="900">Gestão condominial</text>
  <text x="70" y="292" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="900">com acesso seguro</text>
  <text x="72" y="350" fill="#DCFCE7" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">ASP.NET Core + React + MySQL + JWT + RBAC por condomínio</text>

  <g filter="url(#shadow)">
    <rect x="690" y="132" width="420" height="350" rx="32" fill="url(#card)"/>
    <text x="730" y="190" fill="#0B3D2E" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="900" letter-spacing="4">FLUXO DO MVP</text>
    <g font-family="Inter, Arial, sans-serif" font-weight="800" font-size="24" fill="#111827">
      <text x="760" y="250">Master</text>
      <text x="760" y="316">Admin</text>
      <text x="760" y="382">Síndico</text>
      <text x="760" y="448">Morador</text>
    </g>
    <g stroke="#16A34A" stroke-width="4" stroke-linecap="round">
      <path d="M735 257H720V316H735"/>
      <path d="M735 323H720V382H735"/>
      <path d="M735 389H720V448H735"/>
    </g>
    <g font-family="Inter, Arial, sans-serif" font-weight="700" font-size="16" fill="#4B5563">
      <text x="890" y="250">cria condomínios</text>
      <text x="890" y="316">opera estrutura</text>
      <text x="890" y="382">atua por permissão</text>
      <text x="890" y="448">acompanha sua unidade</text>
    </g>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">
    <rect x="72" y="430" width="160" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.15"/>
    <text x="102" y="462" fill="#FFFFFF">Multi-tenant</text>
    <rect x="250" y="430" width="170" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.15"/>
    <text x="282" y="462" fill="#FFFFFF">API real</text>
    <rect x="438" y="430" width="190" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.15"/>
    <text x="470" y="462" fill="#FFFFFF">UI responsiva</text>
  </g>
</svg>

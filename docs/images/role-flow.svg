<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo de papéis do MORAÊ</title>
  <desc id="desc">Fluxo entre Master, Admin, Síndico e Morador com responsabilidades e isolamento de dados.</desc>
  <rect width="1200" height="520" rx="36" fill="#F3F4F6"/>
  <text x="60" y="72" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900">Fluxo de acesso</text>
  <text x="60" y="112" fill="#4B5563" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Cada perfil enxerga apenas o que faz sentido para sua responsabilidade.</text>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#111827" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16A34A"/>
    </marker>
  </defs>

  <g filter="url(#shadow)">
    <rect x="60" y="170" width="230" height="210" rx="28" fill="#FFFFFF"/>
    <rect x="86" y="196" width="58" height="58" rx="18" fill="#DCFCE7"/>
    <text x="104" y="234" fill="#16A34A" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900">M</text>
    <text x="86" y="292" fill="#0B3D2E" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="900">Master</text>
    <text x="86" y="326" fill="#4B5563" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Cria condomínios,</text>
    <text x="86" y="350" fill="#4B5563" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">admins e cobranças</text>
    <text x="86" y="374" fill="#4B5563" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">institucionais.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="350" y="170" width="230" height="210" rx="28" fill="#FFFFFF"/>
    <rect x="376" y="196" width="58" height="58" rx="18" fill="#DCFCE7"/>
    <text x="396" y="234" fill="#16A34A" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900">A</text>
    <text x="376" y="292" fill="#0B3D2E" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="900">Admin</text>
    <text x="376" y="326" fill="#4B5563" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Gerencia prédios,</text>
    <text x="376" y="350" fill="#4B5563" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">unidades, moradores,</text>
    <text x="376" y="374" fill="#4B5563" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">convites e permissões.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="640" y="170" width="230" height="210" rx="28" fill="#FFFFFF"/>
    <rect x="666" y="196" width="58" height="58" rx="18" fill="#DCFCE7"/>
    <text x="685" y="234" fill="#16A34A" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900">S</text>
    <text x="666" y="292" fill="#0B3D2E" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="900">Síndico</text>
    <text x="666" y="326" fill="#4B5563" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Acessa somente</text>
    <text x="666" y="350" fill="#4B5563" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">o prédio e recursos</text>
    <text x="666" y="374" fill="#4B5563" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">permitidos.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="930" y="170" width="230" height="210" rx="28" fill="#FFFFFF"/>
    <rect x="956" y="196" width="58" height="58" rx="18" fill="#DCFCE7"/>
    <text x="973" y="234" fill="#16A34A" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900">R</text>
    <text x="956" y="292" fill="#0B3D2E" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="900">Morador</text>
    <text x="956" y="326" fill="#4B5563" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Consulta unidade,</text>
    <text x="956" y="350" fill="#4B5563" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">boletos, avisos e</text>
    <text x="956" y="374" fill="#4B5563" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">ocorrências.</text>
  </g>

  <path d="M295 275H340" stroke="#16A34A" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M585 275H630" stroke="#16A34A" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M875 275H920" stroke="#16A34A" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="60" y="420" width="1100" height="54" rx="18" fill="#DCFCE7"/>
  <text x="86" y="455" fill="#0B3D2E" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800">Segurança central: autorização no backend por papel global + vínculo no condomínio + permissões granulares.</text>
</svg>

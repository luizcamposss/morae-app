<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-label="MORAÊ — Perfis de acesso" font-family="Nunito, Inter, 'Segoe UI', Arial, sans-serif">
  <title>MORAÊ — Perfis de acesso</title>
  <defs>
    <linearGradient id="escBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B3D2E"/>
      <stop offset="1" stop-color="#2FBF8F"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0B3D2E" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="900" height="500" rx="24" fill="#F0FAF5"/>
  <circle cx="450" cy="280" r="210" fill="none" stroke="#D7EEE2" stroke-width="1.5" stroke-dasharray="6 6"/>

  <text x="40" y="34" font-size="20" font-weight="800" fill="#0B3D2E">Perfis de acesso</text>
  <text x="40" y="56" font-size="13" font-weight="600" fill="#1E8F68">Escopo decrescente de acesso</text>

  <!-- barra de gradiente -->
  <rect x="46" y="110" width="16" height="330" rx="8" fill="url(#escBar)"/>
  <text x="30" y="196" font-size="12.5" font-weight="700" fill="#145B44" text-anchor="middle" transform="translate(30,196) rotate(-90)" letter-spacing="1.5">Escopo de acesso</text>
  <text x="74" y="118" font-size="12" font-weight="700" fill="#145B44">Acesso total</text>
  <text x="74" y="432" font-size="12" font-weight="700" fill="#1E8F68">Acesso básico</text>

  <!-- conectores -->
  <line x1="450" y1="160" x2="450" y2="190" stroke="#2FBF8F" stroke-width="3.5"/>
  <path d="M450 188 L442.5 176 L457.5 176 Z" fill="#2FBF8F"/>
  <line x1="450" y1="266" x2="450" y2="296" stroke="#2FBF8F" stroke-width="3.5"/>
  <path d="M450 294 L442.5 282 L457.5 282 Z" fill="#2FBF8F"/>
  <line x1="450" y1="372" x2="450" y2="402" stroke="#2FBF8F" stroke-width="3.5"/>
  <path d="M450 400 L442.5 388 L457.5 388 Z" fill="#2FBF8F"/>

  <!-- Master -->
  <rect x="340" y="84" width="220" height="76" rx="14" fill="#0B3D2E" filter="url(#shadow)"/>
  <circle cx="386" cy="122" r="24" fill="#FFFFFF" opacity="0.10"/>
  <g transform="translate(386,122)">
    <rect x="-15" y="-20" width="30" height="36" rx="3" fill="#FFFFFF"/>
    <rect x="-10" y="-28" width="20" height="12" rx="2" fill="#FFFFFF"/>
    <rect x="-5" y="-25" width="4" height="5" rx="1" fill="#0B3D2E"/>
    <rect x="1" y="-25" width="4" height="5" rx="1" fill="#0B3D2E"/>
    <rect x="-9" y="-14" width="4" height="5" rx="1" fill="#0B3D2E"/>
    <rect x="-1" y="-14" width="4" height="5" rx="1" fill="#0B3D2E"/>
    <rect x="7" y="-14" width="4" height="5" rx="1" fill="#0B3D2E"/>
    <rect x="-9" y="-4" width="4" height="5" rx="1" fill="#0B3D2E"/>
    <rect x="-1" y="-4" width="4" height="5" rx="1" fill="#0B3D2E"/>
    <rect x="7" y="-4" width="4" height="5" rx="1" fill="#0B3D2E"/>
    <rect x="-3.5" y="8" width="7" height="8" rx="2" fill="#0B3D2E"/>
  </g>
  <text x="424" y="118" font-size="22" font-weight="800" fill="#FFFFFF">Master</text>
  <text x="424" y="140" font-size="12.5" font-weight="600" fill="#FFFFFF" opacity="0.75">Acesso total</text>

  <!-- Admin -->
  <rect x="310" y="190" width="280" height="76" rx="14" fill="#145B44" filter="url(#shadow)"/>
  <circle cx="356" cy="228" r="24" fill="#FFFFFF" opacity="0.10"/>
  <g transform="translate(356,228)">
    <g fill="#FFFFFF">
      <rect x="-2.2" y="-16.5" width="4.4" height="7" rx="1.5"/>
      <rect x="-2.2" y="-16.5" width="4.4" height="7" rx="1.5" transform="rotate(45)"/>
      <rect x="-2.2" y="-16.5" width="4.4" height="7" rx="1.5" transform="rotate(90)"/>
      <rect x="-2.2" y="-16.5" width="4.4" height="7" rx="1.5" transform="rotate(135)"/>
      <rect x="-2.2" y="-16.5" width="4.4" height="7" rx="1.5" transform="rotate(180)"/>
      <rect x="-2.2" y="-16.5" width="4.4" height="7" rx="1.5" transform="rotate(225)"/>
      <rect x="-2.2" y="-16.5" width="4.4" height="7" rx="1.5" transform="rotate(270)"/>
      <rect x="-2.2" y="-16.5" width="4.4" height="7" rx="1.5" transform="rotate(315)"/>
      <circle r="12"/>
      <circle r="4.5" fill="#145B44"/>
    </g>
  </g>
  <text x="394" y="224" font-size="22" font-weight="800" fill="#FFFFFF">Admin</text>
  <text x="394" y="246" font-size="12.5" font-weight="600" fill="#FFFFFF" opacity="0.75">Gestão do condomínio</text>

  <!-- Síndico -->
  <rect x="280" y="296" width="340" height="76" rx="14" fill="#1E8F68" filter="url(#shadow)"/>
  <circle cx="326" cy="334" r="24" fill="#FFFFFF" opacity="0.10"/>
  <g transform="translate(326,334)">
    <g fill="#FFFFFF">
      <circle cx="-9.5" cy="-4" r="6"/>
      <circle cx="-9.5" cy="-4" r="2.8" fill="#1E8F68"/>
      <rect x="-4" y="-7" width="21" height="6" rx="3"/>
      <rect x="11" y="-1" width="4.5" height="7" rx="2"/>
      <rect x="17" y="1" width="4.5" height="7" rx="2"/>
    </g>
  </g>
  <text x="364" y="330" font-size="22" font-weight="800" fill="#FFFFFF">Síndico</text>
  <text x="364" y="352" font-size="12.5" font-weight="600" fill="#FFFFFF" opacity="0.75">Prédio vinculado</text>

  <!-- Morador -->
  <rect x="250" y="402" width="400" height="76" rx="14" fill="#2FBF8F" filter="url(#shadow)"/>
  <circle cx="296" cy="440" r="24" fill="#0B3D2E" opacity="0.08"/>
  <g transform="translate(296,440)">
    <g fill="#0B3D2E">
      <path d="M-17 2 L0 -14 L17 2 L13 2 L13 16 L-13 16 L-13 2 Z"/>
      <rect x="-4" y="6" width="8" height="10" fill="#2FBF8F"/>
      <rect x="4" y="3" width="6" height="6" rx="1" fill="#2FBF8F"/>
    </g>
  </g>
  <text x="334" y="436" font-size="22" font-weight="800" fill="#08341F">Morador</text>
  <text x="334" y="458" font-size="12.5" font-weight="600" fill="#0B3D2E" opacity="0.7">Acesso pessoal</text>
</svg>
